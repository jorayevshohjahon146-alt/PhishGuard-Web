<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PhishGuard Pro AI — Cyber Ecosystem</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --bd: #334155;
      --tx: #f8fafc;
      --mu: #94a3b8;
      --ac: #38bdf8;
      --ac-hover: #0284c7;
      --low: #10b981;
      --mid: #f59e0b;
      --high: #ef4444;
      --glow: rgba(56, 189, 248, 0.15);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--tx);
      font: 14px/1.6 'Inter', system-ui, -apple-system, sans-serif;
      padding-bottom: 60px;
    }

    header {
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--bd);
      padding: 16px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: 0.5px;
      color: var(--tx);
    }

    .brand-icon {
      width: 14px;
      height: 14px;
      background: var(--ac);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--ac);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(56, 189, 248, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
    }

    .lang-select {
      border: 1px solid var(--bd);
      background: #0f172a;
      color: var(--tx);
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      transition: all 0.2s;
    }
    .lang-select:hover { border-color: var(--ac); }

    main { max-width: 900px; margin: 32px auto; padding: 0 20px; }

    .nav-tabs {
      display: flex;
      gap: 8px;
      background: var(--card);
      padding: 8px;
      border: 1px solid var(--bd);
      border-radius: 16px;
      margin-bottom: 24px;
      overflow-x: auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }

    .nav-tabs button {
      flex: 1;
      background: transparent;
      border: 0;
      padding: 12px 18px;
      font: inherit;
      font-weight: 600;
      color: var(--mu);
      cursor: pointer;
      border-radius: 10px;
      white-space: nowrap;
      transition: all 0.25s ease;
    }

    .nav-tabs button:hover { color: var(--tx); background: rgba(255,255,255,0.05); }

    .nav-tabs button.on {
      background: var(--ac);
      color: #0f172a;
      font-weight: 700;
      box-shadow: 0 0 16px var(--glow);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.25);
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--ac), transparent);
    }

    h2 { margin: 0 0 8px; font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
    p { margin: 4px 0 20px; color: var(--mu); font-size: 14px; }

    textarea, input[type=file], input[type=text] {
      width: 100%;
      border: 1px solid var(--bd);
      border-radius: 12px;
      padding: 14px;
      font: inherit;
      outline: none;
      background: #0f172a;
      color: var(--tx);
      margin-bottom: 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    textarea:focus, input:focus {
      border-color: var(--ac);
      box-shadow: 0 0 12px var(--glow);
    }

    textarea { min-height: 120px; resize: vertical; }

    .btn {
      background: var(--ac);
      color: #0f172a;
      border: 0;
      border-radius: 12px;
      padding: 14px 28px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn:hover { background: var(--ac-hover); color: #fff; transform: translateY(-1px); }

    .res-box {
      margin-top: 20px;
      padding: 20px;
      border-radius: 14px;
      border: 1px solid var(--bd);
      background: rgba(15, 23, 42, 0.6);
    }

    .res-box.low { border-color: var(--low); box-shadow: 0 0 15px rgba(16, 185, 129, 0.15); }
    .res-box.mid { border-color: var(--mid); box-shadow: 0 0 15px rgba(245, 158, 11, 0.15); }
    .res-box.high { border-color: var(--high); box-shadow: 0 0 15px rgba(239, 68, 68, 0.15); }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 30px;
      font-weight: 800;
      font-size: 12px;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge.low { background: var(--low); color: #000; }
    .badge.mid { background: var(--mid); color: #000; }
    .badge.high { background: var(--high); color: #fff; }

    ul { margin: 12px 0 0 20px; padding: 0; }
    li { margin-bottom: 8px; font-size: 13.5px; color: #cbd5e1; }
    li b { color: var(--tx); }
  </style>
</head>
<body>
<header>
  <div class="brand">
    <div class="brand-icon"></div>
    <span id="header-title">PhishGuard Pro AI</span>
  </div>
  <select class="lang-select" id="langSelect">
    <option value="uz">🇺🇿 O'zbek</option>
    <option value="kr">🇺🇿 Ўзбек</option>
    <option value="ru">🇷🇺 Русский</option>
    <option value="en">🇬🇧 English</option>
    <option value="tr">🇹🇷 Türkçe</option>
  </select>
</header>
<main>
  <div class="nav-tabs" id="tabs"></div>
  <div class="card">
    <h2 id="card-title">🛡️ Cyber Scanner</h2>
    <p id="card-desc"></p>
    <div id="inp-area"></div>
  </div>
  <div id="out"></div>
</main>
</body>
</html>
